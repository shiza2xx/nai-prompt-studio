name: Windows quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check CommonJS and module syntax
        shell: pwsh
        run: |
          Get-ChildItem electron,tools -Recurse -File | Where-Object Extension -in '.cjs','.mjs' | ForEach-Object { node --check $_.FullName; if ($LASTEXITCODE) { exit $LASTEXITCODE } }
      - run: node node_modules/typescript/bin/tsc --noEmit
      - run: npm test
      - run: npm run build
      - run: npm run release:preflight
